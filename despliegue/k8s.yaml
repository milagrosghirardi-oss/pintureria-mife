# despliegue/k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mife-asistente
  namespace: mife
  labels: {app: mife-asistente}
spec:
  replicas: 2
  selector:
    matchLabels: {app: mife-asistente}
  template:
    metadata:
      labels: {app: mife-asistente}
    spec:
      containers:
        - name: asistente
          image: mife-registry/asistente:latest
          ports: [{containerPort: 8000}]
          env:
            - name: LLM_PROVIDER
              value: "mock"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: mife-secrets, key: ANTHROPIC_API_KEY, optional: true}
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mife-asistente
  namespace: mife
spec:
  selector: {app: mife-asistente}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mife-asistente-hpa
  namespace: mife
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: mife-asistente}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: v1
kind: Secret
metadata:
  name: mife-secrets
  namespace: mife
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REEMPLAZAR_CON_TU_API_KEY"
